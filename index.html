<title>2D対戦格闘ゲーム オンライン対応版</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
:root{--bg:#eef0f5;--fg:#14161f;--bt:#d6dae6;--bd:#8d94ad;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14151b;--fg:#eceef6;--bt:#2a2d3a;--bd:#5a617a}}
:root[data-theme="dark"]{--bg:#14151b;--fg:#eceef6;--bt:#2a2d3a;--bd:#5a617a}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:14px system-ui,sans-serif;display:flex;flex-direction:column;user-select:none;-webkit-user-select:none;touch-action:none;overflow:hidden}
canvas{width:100%;flex:1;min-height:0;object-fit:contain;background:#0d0e14}
#pad{display:flex;justify-content:space-between;align-items:center;padding:6px 12px 10px}
.g{display:grid;gap:6px}
#d{position:relative;width:126px;height:126px;border-radius:50%;background:var(--bt);border:2px solid var(--bd);touch-action:none;flex-shrink:0}
#k{position:absolute;left:33px;top:33px;width:60px;height:60px;border-radius:50%;background:var(--bd);pointer-events:none}
#b{flex:1;max-width:290px;margin-left:10px;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,64px)}
#tb{position:fixed;top:calc(env(safe-area-inset-top,0px) + 34px);right:6px;z-index:9;background:var(--bg);border:2px solid var(--bd);border-radius:10px;display:none;flex-direction:column;gap:4px;padding:6px}
#tb.open{display:flex}
#gear{position:fixed;top:calc(env(safe-area-inset-top,0px) + 2px);right:4px;z-index:9;width:32px;height:28px;padding:0;font-size:15px;border-radius:8px;opacity:.85}
#bonlBtn{position:fixed;top:calc(env(safe-area-inset-top,0px) + 2px);left:4px;z-index:9;height:28px;padding:0 8px;font-size:11px;border-radius:8px;opacity:.9;border-color:#4aa3ff}
#bonlBtn.live{border-color:#38d9a9;color:#38d9a9}
#tb button{font:bold 11px system-ui;padding:5px 7px;border-radius:8px}
#tb button:disabled{opacity:.4}
button{background:var(--bt);color:var(--fg);border:2px solid var(--bd);border-radius:14px;font:bold 18px system-ui;touch-action:none;padding:0}
button.on{filter:brightness(1.5)}
#bsys{border-color:#e0a84d;color:#ffd34d}
#ml,#onl{position:fixed;inset:0;background:rgba(10,12,18,.94);color:#eceef6;display:none;flex-direction:column;padding:16px;overflow-y:auto;z-index:10;touch-action:pan-y}
#ml.open,#onl.open{display:flex}
#ml h2,#onl h2{margin:0 0 10px;font-size:17px;display:flex;justify-content:space-between;align-items:center}
#ml table{width:100%;border-collapse:collapse;font-size:12px;margin-bottom:10px}
#ml th,#ml td{border:1px solid #444960;padding:5px 6px;text-align:left}
#ml th{background:#232738}
.ocard{background:#1b1e2b;border:1px solid #444960;border-radius:12px;padding:12px;margin-bottom:10px}
.ocard h3{margin:0 0 8px;font-size:14px;color:#6fe3ff}
.orow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.obtn{padding:8px 12px;font-size:13px;border-radius:10px;background:#2a2d3a;color:#eceef6;border:2px solid #5a617a;touch-action:manipulation}
.obtn.sel{border-color:#ffd34d;color:#ffd34d;background:#343228}
.obtn.pri{border-color:#4aa3ff;background:#1d3554;color:#fff}
.obtn.dan{border-color:#ff5d5d;background:#4a2028;color:#fff}
.oinp{background:#0d0e14;color:#fff;border:2px solid #5a617a;border-radius:10px;padding:8px 10px;font:bold 18px monospace;width:110px;text-align:center;letter-spacing:3px;touch-action:manipulation;user-select:text;-webkit-user-select:text}
.codebox{font:bold 24px monospace;letter-spacing:4px;color:#ffd34d;background:#0d0e14;padding:6px 14px;border-radius:8px;border:1px solid #5a617a}
#bsup{grid-column:1/-1;height:38px;font-size:15px;border-color:#e0a84d;color:#ffd34d;visibility:hidden}
#bsup.rdy{visibility:visible;animation:pl .7s infinite alternate}
@keyframes pl{to{filter:brightness(1.7)}}
@media (orientation:landscape){
body{flex-direction:row;align-items:center}
canvas{order:1;flex:1;min-width:0;height:100%}
#pad{display:contents}
#d{order:0;margin:0 8px;width:108px;height:108px}
#k{left:24px;top:24px}
#b{order:2;flex:none;max-width:none;margin:0 8px;grid-template-columns:repeat(3,56px);grid-template-rows:repeat(2,56px) auto}
}

let AC=null,SND=1,HB_VIS=1,FM_VIS=1;
function se(type){
  if(!SND)return;
  try{
    if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();
    if(AC.state==='suspended')AC.resume();
    const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime;
    o.connect(g);g.connect(AC.destination);
    if(type==='hit'){o.type='sawtooth';o.frequency.setValueAtTime(180,t);o.frequency.exponentialRampToValueAtTime(55,t+.11);g.gain.setValueAtTime(.18,t);g.gain.exponentialRampToValueAtTime(.001,t+.11);o.start(t);o.stop(t+.12)}
    else if(type==='heavy'){o.type='square';o.frequency.setValueAtTime(130,t);o.frequency.exponentialRampToValueAtTime(38,t+.2);g.gain.setValueAtTime(.25,t);g.gain.exponentialRampToValueAtTime(.001,t+.2);o.start(t);o.stop(t+.21)}
    else if(type==='blk'){o.type='triangle';o.frequency.setValueAtTime(420,t);o.frequency.exponentialRampToValueAtTime(220,t+.06);g.gain.setValueAtTime(.14,t);g.gain.exponentialRampToValueAtTime(.001,t+.06);o.start(t);o.stop(t+.07)}
    else if(type==='gb'){o.type='sawtooth';o.frequency.setValueAtTime(620,t);o.frequency.exponentialRampToValueAtTime(90,t+.28);g.gain.setValueAtTime(.25,t);g.gain.exponentialRampToValueAtTime(.001,t+.28);o.start(t);o.stop(t+.29)}
    else if(type==='chg'){o.type='sine';o.frequency.setValueAtTime(520,t);o.frequency.exponentialRampToValueAtTime(880,t+.12);g.gain.setValueAtTime(.14,t);g.gain.exponentialRampToValueAtTime(.001,t+.12);o.start(t);o.stop(t+.13)}
    else if(type==='sup'){o.type='sawtooth';o.frequency.setValueAtTime(220,t);o.frequency.exponentialRampToValueAtTime(760,t+.32);g.gain.setValueAtTime(.22,t);g.gain.exponentialRampToValueAtTime(.001,t+.32);o.start(t);o.stop(t+.33)}
    else if(type==='tech'){o.type='triangle';o.frequency.setValueAtTime(700,t);o.frequency.exponentialRampToValueAtTime(300,t+.14);g.gain.setValueAtTime(.2,t);g.gain.exponentialRampToValueAtTime(.001,t+.14);o.start(t);o.stop(t+.15)}
    else if(type==='grab'){o.type='triangle';o.frequency.setValueAtTime(260,t);o.frequency.exponentialRampToValueAtTime(440,t+.08);g.gain.setValueAtTime(.18,t);g.gain.exponentialRampToValueAtTime(.001,t+.08);o.start(t);o.stop(t+.09)}
  }catch(e){}
}

function packLocalBits(inp){
  let b=0;
  if(inp.l)b|=1;
  if(inp.r)b|=2;
  if(inp.u)b|=4;
  if(inp.d)b|=8;
  if(inp.h.P)b|=16;
  if(inp.h.K)b|=32;
  if(inp.h.S)b|=64;
  if(inp.h.T)b|=128;
  if(inp.h.X)b|=256;
  if(inp.h.SYS)b|=512;
  if(inp.pr.SUP)b|=1024;
  return b;
}

function applyBitsToInp(bits,prevBits,dst){
  dst.l=(bits&1)?1:0;
  dst.r=(bits&2)?1:0;
  dst.u=(bits&4)?1:0;
  dst.d=(bits&8)?1:0;
  dst.pr={};
  for(let idx=0;idx<BTN_KEYS.length;idx++){
    const k=BTN_KEYS[idx];
    const mask=1<<(4+idx);
    const cur=(bits&mask)?1:0;
    const prv=(prevBits&mask)?1:0;
    dst.h[k]=cur;
    if(cur&&!prv){
      dst.pr[k]=1;
      dst.buf.push({b:k,t:14});
    }
  }
  if(bits&1024)dst.pr.SUP=1;
}

function sendNet(obj){
  if(NET.conn&&NET.conn.open){
    try{NET.conn.send(obj)}catch(e){}
  }
}

function pumpLocalNetInputs(){
  if(!NET.active)return;
  const target=NET.simFr+NET.delay;
  const myMap=NET.side===1?NET.in1:NET.in2;
  const bits=packLocalBits(LOC);
  while(NET.locSentUpTo<target){
    NET.locSentUpTo++;
    myMap.set(NET.locSentUpTo,bits);
  }
  LOC.pr.SUP=0;
  // パケットロス耐性のため直近6フレーム分の確定入力をまとめて送信
  const list=[];
  for(let f=Math.max(0,NET.locSentUpTo-5);f<=NET.locSentUpTo;f++){
    if(myMap.has(f))list.push([f,myMap.get(f)]);
  }
  sendNet({t:'in',list});
}

function isBusy(q){

function classifyFrame(q){
  const inv=(isInv(q,0)&&isInv(q,1))?3:(q.s==='atk'&&q.m&&q.m.projInv&&q.fr<=q.m.projInv)?2:(q.s==='atk'&&q.m&&q.m.aaInv&&q.fr<=q.m.aaInv)?1:0;
  if(q.thWin>0)return{t:'grab',inv:3,lbl:'掴み'};
  if(q.s==='thAtk')return{t:'act',inv:3,lbl:'投げ動作'};
  if(q.s==='thDef')return{t:'stun',inv:3,lbl:'被投げ'};
  if(q.s==='ch')return{t:'start',inv,lbl:'タメ'};
  if(q.s==='atk'&&q.m){
    const m=q.m;
    if(q.fr<m.s)return{t:'start',inv,lbl:'発生前'};
    const actEnd=m.a>0?m.s+m.a:m.s+1;
    if(q.fr<actEnd)return{t:'act',inv,lbl:'持続'};
    return{t:'rec',inv,lbl:'硬直'};
  }
  if(q.s==='hs'||q.s==='bs'||q.s==='gb'||q.s==='dn')return{t:'stun',inv,lbl:'被硬直'};
  if(q.s==='bstep')return{t:'mov',inv,lbl:'バクステ'};
  if(q.s==='js'||q.s==='air')return{t:'mov',inv,lbl:'空中'};
  if(q.w!==0)return{t:'mov',inv,lbl:'移動'};
  return{t:'idle',inv:0,lbl:''};
}
function recordFM(){
  const pBusy=isBusy(P),eBusy=isBusy(E);
  if(pBusy||eBusy){
    if(!FM.active){resetFM();FM.active=1}
    FM.idle=0;
    if(P.s==='atk'&&P.fr===1&&P.m){
      FM.atkSide=1;FM.lastMove=P.m.n;FM.lastData={s:P.m.s,a:P.m.a||1,t:P.m.t};
    }else if(E.s==='atk'&&E.fr===1&&E.m&&FM.atkSide!==1){
      FM.atkSide=2;FM.lastMove=E.m.n;FM.lastData={s:E.m.s,a:E.m.a||1,t:E.m.t};
    }
    if(FM.atkSide===1){if(pBusy)FM.atkBusy++;if(eBusy)FM.defBusy++}
    else if(FM.atkSide===2){if(eBusy)FM.atkBusy++;if(pBusy)FM.defBusy++}
  }else if(FM.active){
    if(FM.adv===null&&FM.atkSide>0&&FM.defBusy>0)FM.adv=FM.defBusy-FM.atkBusy;
    FM.idle++;
    if(FM.idle>28){FM.active=0;return}
  }else{
    return;
  }
  FM.p.push(classifyFrame(P));
  FM.e.push(classifyFrame(E));
  if(FM.p.length>FM.max){FM.p.shift();FM.e.shift()}
}

        ln=9*q;
        if(m.k.includes('K')){
          lF=[86*q,75*q];lB=[-22,-8];extK=reachPx*0.85;
        }else{
          aF=[95*q,82*q];aB=[20,110];extF=reachPx*0.85;
        }
      }
    }else if(m.h==='l'){
      if(isWindup){
        hh=38-16*wup;ln=-14*wup;
        lF=[-45*wup,-85*wup];lB=[-35,-70];
        aF=[25,95];aB=[-35,65];
      }else{
        hh=24;lF=[86*q,92*q];lB=[-35,-65];ln=8*q;extK=reachPx*0.9;
      }
    }else if(m.k.includes('K')){
      const isHighKick=(m.k==='NK'&&p.cid===1);
      if(isWindup){
        ln=-13*wup;lF=[-42*wup,-100*wup];lB=[-22,-8];
        aF=[65,135];aB=[-35,75];
      }else{
        lF=isHighKick?[112*q,122*q]:[84*q,90*q];
        ln=(isHighKick?-11:-7)*q;
        if(!p.cr)lB=[-20,-10];
        extK=reachPx*0.9;
      }
    }else if(m.k.includes('P')||m.k.startsWith('TC')||m.k==='NPM'){
      const heavy=(m.k==='NP'||m.k==='NPM'||m.k==='BP');
      if(isWindup){
        ln=(heavy?-15:-11)*wup;
        lF=[32,12];lB=[-32,-12];
        aF=[(heavy?-75:-50)*wup,142];
        aB=[55,130];
      }else{
        aF=[30+60*q,150-62*q];ln=7*q;extF=reachPx*0.85;
      }
    }else{
      if(isWindup){
        if(m.k==='NS'&&p.cid===1){
          hh=38-14*wup;ln=-15*wup;lF=[36,10];lB=[-36,-10];
          aF=[-35,115];aB=[-45,105];
        }else if(m.k==='BS'||m.k==='XB'){
          hh=38-12*wup;ln=14*wup;lF=[45,0];lB=[-40,-20];
        }else{
          ln=-11*wup;lF=[30,10];lB=[-30,-10];
          aF=[-45*wup,105];aB=[-55*wup,95];
        }
      }else{
        aF=[30+55*q,150-60*q];aB=[30+65*q,150-60*q];ln=8*q;extF=reachPx*0.7;
      }
    }
  }

  const sx=ln,sy=-hh-30+eo,hy=-hh+eo;
  const armF=limbPts(sx,sy+3,aF[0],15+extF*.45,aF[1],15+extF*.55);
  const armB=limbPts(sx,sy+3,aB[0],15,aB[1],15);
  const legF=limbPts(0,hy,lF[0],19+extK*.45,lF[1],19+extK*.55);
  const legB=limbPts(0,hy,lB[0],19+extB*.45,lB[1],19+extB*.55);
  return{
    s,hh,ln,eo,aF,aB,lF,lB,extF,extK,extB,sx,sy,hy,isWindup,wup,tilt,
    hip:toWorld(p,0,hy),
    shoulder:toWorld(p,sx,sy),
    head:toWorld(p,sx*1.2+2,sy-12),
    elbowF:toWorld(p,armF.j.x,armF.j.y),
    handF:toWorld(p,armF.e.x,armF.e.y),
    elbowB:toWorld(p,armB.j.x,armB.j.y),
    handB:toWorld(p,armB.e.x,armB.e.y),
    kneeF:toWorld(p,legF.j.x,legF.j.y),
    footF:toWorld(p,legF.e.x,legF.e.y),
    kneeB:toWorld(p,legB.j.x,legB.j.y),
    footB:toWorld(p,legB.e.x,legB.e.y)
  };
}

function segBox(a,b,pad,part){
  return{
    x1:Math.min(a.x,b.x)-pad,
    y1:Math.min(a.y,b.y)-pad,
    x2:Math.max(a.x,b.x)+pad,
    y2:Math.max(a.y,b.y)+pad,
    part
  };
}
function ptBox(pt,rx,ry,part){
  return{x1:pt.x-rx,y1:pt.y-ry,x2:pt.x+rx,y2:pt.y+ry,part};
}
function rectsOverlap(a,b){
  return a.x1<=b.x2&&a.x2>=b.x1&&a.y1<=b.y2&&a.y2>=b.y1;
}
function circleRectOverlap(cx,cy,rad,b){
  const nx=Math.max(b.x1,Math.min(cx,b.x2));
  const ny=Math.max(b.y1,Math.min(cy,b.y2));
  return Math.hypot(cx-nx,cy-ny)<=rad;
}

function getHurtboxes(p){
  const y=G+p.y;
  if(p.s==='dn'){
    return[
      {x1:p.x-48,y1:y-20,x2:p.x-30,y2:y-3,part:'head'},
      {x1:p.x-32,y1:y-16,x2:p.x+34,y2:y-2,part:'body'}
    ];
  }
  const po=getPose(p);
  return[
    ptBox(po.head,11,11,'head'),
    segBox(po.shoulder,po.hip,10,'torso'),
    segBox(po.shoulder,po.handF,6,'armF'),
    segBox(po.shoulder,po.handB,5,'armB'),
    segBox(po.hip,po.footF,7,'legF'),
    segBox(po.hip,po.footB,6,'legB')
  ];
}

function getPushbox(p){
  const h=p.cr?52:82;
  return{x1:p.x-CW/2,y1:G+p.y-h,x2:p.x+CW/2,y2:G+p.y};
}

const NORM_KEYS=new Set(['NP','NPM','FP','DP','BP','TC1','TC2','TCK','NK','FK','DK','BK']);

function getHitboxes(p,m){
  const po=getPose(p),y=G+p.y;
  const xFront=p.x+p.f*(CW+m.r*CW);
  const xBack=p.x-p.f*(CW/2+(m.backR||0)*CW);
  if(m.th){
    const x0=p.x-p.f*8,x1=p.x+p.f*(CW*0.75+m.r*CW*0.65);
    return[{x1:Math.min(x0,x1),y1:y-76,x2:Math.max(x0,x1),y2:y-16,kind:'throw'}];
  }
  if(m.up){
    const x0=p.x-p.f*10;
    return[{x1:Math.min(x0,xFront),y1:y-115,x2:Math.max(x0,xFront),y2:y+6,kind:'strike'}];
  }
  if(m.rev){
    return[{x1:Math.min(xFront,xBack),y1:y-94,x2:Math.max(xFront,xBack),y2:y-6,kind:'strike'}];
  }
  if(m.air){
    if(m.k==='JK'){
      const y1=Math.min(po.footF.y,po.footB.y)-12;
      const y2=Math.max(po.footF.y,po.footB.y)+12;
      return[{x1:Math.min(xFront,xBack),y1,x2:Math.max(xFront,xBack),y2,kind:'strike'}];
    }
    const x0=po.shoulder.x;
    return[{x1:Math.min(x0,xFront),y1:po.handF.y-12,x2:Math.max(x0,xFront),y2:po.handF.y+12,kind:'strike'}];
  }
  if(NORM_KEYS.has(m.k)){
    const isKick=m.k.includes('K');
    if(m.h==='l'){
      const x0=po.hip.x;
      const yTop=Math.min(po.footF.y-10,y-18);
      return[{x1:Math.min(x0,xFront),y1:yTop,x2:Math.max(x0,xFront),y2:y,kind:'strike'}];
    }
    if(isKick){
      const x0=po.hip.x;
      const cy=po.footF.y;
      return[{x1:Math.min(x0,xFront),y1:cy-11,x2:Math.max(x0,xFront),y2:cy+11,kind:'strike'}];
    }
    const x0=po.shoulder.x;
    const cy=po.handF.y;
    return[{x1:Math.min(x0,xFront),y1:cy-10,x2:Math.max(x0,xFront),y2:cy+10,kind:'strike'}];
  }
  if(m.h==='l'){
    const x0=po.hip.x;
    const yTop=Math.min(po.footF.y-10,y-22);
    return[{x1:Math.min(x0,xFront),y1:yTop,x2:Math.max(x0,xFront),y2:y,kind:'strike'}];
  }
  if(m.h==='m'){
    const isKick=m.k.includes('K');
    const anchorY=isKick?po.footF.y:po.handF.y;
    const x0=isKick?po.hip.x:po.shoulder.x;
    return[{x1:Math.min(x0,xFront),y1:anchorY-14,x2:Math.max(x0,xFront),y2:anchorY+14,kind:'strike'}];
  }
  const useFoot=m.k.includes('K');
  const anchorY=useFoot?po.footF.y:po.handF.y;
  const x0=useFoot?po.hip.x:po.shoulder.x;
  return[{x1:Math.min(x0,xFront),y1:anchorY-12,x2:Math.max(x0,xFront),y2:anchorY+12,kind:'strike'}];
}

function resolveInput(p,i){
  const C0=CHARS[p.cid],M=C0.M;
  const lr=i.l&&i.r;
  const fw=lr?0:(p.f>0?i.r:i.l),bk=lr?0:(p.f>0?i.l:i.r);
  if(p.thWin>0&&(i.pr.T||(i.pr.P&&i.pr.K))){
    const o=p.thBy;
    p.thWin=0;p.s='bs';p.t=30;p.x-=p.f*36;
    if(o){o.s='bs';o.t=30;o.x-=o.f*36}
    pop(p,'投げ抜け！');se('tech');
    return;
  }
  if((p.s==='bs'||p.s==='dn')&&bk&&i.pr.SYS&&p.g>=1){
    p.g-=1;p.y=0;p.vy=0;p.airUsed=0;go(p,M.REV);pop(p,'切り返し！');se('tech');
    return;
  }
  if(p.s==='air'&&!p.airUsed){
    if(i.pr.P&&M.JP){p.airUsed=1;go(p,M.JP);return}
    if(i.pr.K&&M.JK){p.airUsed=1;go(p,M.JK);return}
    return;
  }
  if((p.s==='atk'||p.s==='ch')&&p.fr<=8&&p.m!==M.SUP&&p.m!==M.T&&!p.m.air&&!p.m.up){
    if(i.pr.SUP&&p.g>=4){p.y=0;p.vy=0;startSuper(p);return}
    if(i.pr.T){p.y=0;p.vy=0;go(p,M.T);return}
    if(i.pr.X&&p.g>=1&&!p.m.k.startsWith('X')){
      const xk='X'+(i.d?'D':fw?'F':bk?'B':'N');
      if(M[xk]){p.y=0;p.vy=0;p.g-=1;go(p,M[xk]);return}
    }
  }
  if(p.s==='atk'&&p.m.tc&&p.fr>=p.m.s){
    const nxt=i.pr.P?p.m.tc.P:i.pr.K?p.m.tc.K:null;
    if(nxt&&M[nxt]){go(p,M[nxt]);return}
  }
  if(p.s==='atk'&&p.m.dashDerive&&p.fr>=5&&p.fr<=23){
    const nxt=i.pr.P?p.m.dashDerive.P:i.pr.K?p.m.dashDerive.K:null;
    if(nxt&&M[nxt]){go(p,M[nxt]);return}
  }
  if(p.s==='atk'&&p.hit&&!p.m.th&&(p.m.c||p.m.exC)&&!p.m.air){
    if(i.pr.SUP&&p.g>=4){p.y=0;p.vy=0;startSuper(p);return}
    if(i.pr.X&&p.g>=1){
      const xk='X'+(i.d?'D':fw?'F':bk?'B':'N');
      if(M[xk]){p.y=0;p.vy=0;p.g-=1;go(p,M[xk]);pop(p,'EXキャンセル！');return}
    }
    if(p.m.c&&i.pr.S){
      const sk=(i.d?'D':fw?'F':bk?'B':'N')+'S';
      if(sk==='FS'&&p.cid===2&&p.stock<=0){go(p,M.NS);return}
      if(sk==='FS'&&p.cid===2)p.stock--;
      if(M[sk]){p.y=0;p.vy=0;go(p,M[sk]);return}
    }
  }
  if(p.s!=='i')return;

  if(i.pr.SUP&&p.g>=4){startSuper(p);return}
  if(i.pr.T){go(p,M.T);return}
  if(fw&&i.pr.SYS&&p.g>=.25){p.g-=.25;go(p,M.GB);return}
  if(i.pr.X&&p.g>=1){
    const m=M['X'+(i.d?'D':fw?'F':bk?'B':'N')];
    if(m){p.g-=1;go(p,m);return}
  }
  const b=i.pr.P?'P':i.pr.K?'K':i.pr.S?'S':0;
  if(b){
    const dir=i.d?'D':fw?'F':bk?'B':'N';
    const key=dir+b;
    if(key===C0.chKey){
      p.s='ch';p.cf=0;p.fr=0;p.m=M[key];p.n='タメ中';return;
    }
    if(p.cid===2&&key==='FS'){
      if(p.stock<=0){go(p,M.NS);return}
      p.stock--;
    }
    if(M[key]){go(p,M[key]);return}
  }
  if(i.u){p.s='js';p.t=12;p.jx=fw?1:bk?-1:0;p.airUsed=0;return}
  if(!i.d&&(fw||bk)){
    p.w=fw?1:-1;
    const spd=fw?C0.spd:C0.spd*.75;
    p.x+=spd*p.f*p.w;
    if(fw&&++p.gw%10===0)p.g=Math.min(4,p.g+.08);
  }
}

function startSuper(p){
  const C0=CHARS[p.cid];
  p.g=0;
  cutT=30;cutTxt=C0.name+'：'+C0.superName+'！';cutCol=C0.col;
  se('sup');
  go(p,C0.M.SUP);
}

function spawnFb(p,kind){
  const d=FBS[kind];if(!d)return;
  if(d.one&&p.fb)return;
  const sx=p.x+p.f*30,sy=d.vy?(p.y-42):(p.y-45);
  const f={
    o:p,kind,x:sx,y:sy,px:sx,py:sy,
    vx:p.f*d.spd,vy:d.vy||0,dir:p.f,life:0,ret:0,hits:0,wait:0
  };
  fbs.push(f);
  if(d.one)p.fb=1;
}

function spawnChaosOrb(p,o,idx){
  const pts=[
    {dx:-120,dy:-80,mid:1},
    {dx:120,dy:-28,mid:0},
    {dx:-100,dy:-28,mid:0},
    {dx:110,dy:-88,mid:1},
    {dx:0,dy:-132,mid:1},
    {dx:-130,dy:-54,mid:0},
    {dx:130,dy:-54,mid:1},
    {dx:0,dy:-95,mid:0}
  ];
  const pt=pts[idx%pts.length];
  const sx=Math.max(18,Math.min(W-18,o.x+pt.dx));
  const sy=Math.min(-18,o.y+pt.dy);
  fbs.push({
    o:p,target:o,kind:pt.mid?'s_chaos_m':'s_chaos_l',
    x:sx,y:sy,px:sx,py:sy,vx:0,vy:0,dir:sx<o.x?1:-1,
    life:0,ret:0,hits:0,wait:28,spd:FBS.s_chaos_m.spd
  });
  se('chg');
}

function step(p,o,i){
  const C0=CHARS[p.cid],M=C0.M;
  if(p.popT>0)p.popT--;
  if(p.twT>0&&--p.twT===0&&p.s==='atk')spawnFb(p,p.twK);
  if(p.s==='i'||p.s==='bs'||p.s==='js'||p.s==='gb')p.f=o.x>p.x?1:-1;
  const lr=i.l&&i.r;
  p.inL=lr?0:i.l;
  p.inR=lr?0:i.r;
  const fw=p.f>0?p.inR:p.inL,bk=p.f>0?p.inL:p.inR;
  p.gd=bk;p.w=0;
  p.cr=p.s==='atk'?!!p.m.c&&i.d:!!i.d&&(p.s==='i'||p.s==='bs'||p.s==='gb');

  if(p.bkTap>0)p.bkTap--;
  if(!bk&&p.prevBk)p.bkTap=10;
  if(bk&&!p.prevBk&&p.bkTap>0&&p.s==='i'&&!i.d){
    p.bkTap=0;p.s='bstep';p.t=22;p.fr=0;p.n='バックステップ';
  }
  p.prevBk=bk;

  if(p.chaosQ>0&&--p.chaosT<=0){
    spawnChaosOrb(p,o,p.chaosIdx++);
    p.chaosQ--;p.chaosT=30;
  }

  if(p.thWin>0){
    resolveInput(p,i);
    if(p.thWin>0&&--p.thWin===0){
      executeThrowAnim(p.thBy,p,p.thM,p.thDir);
    }
    return;
  }

  switch(p.s){
    case'i':resolveInput(p,i);break;
    case'ch':{
      p.cf++;p.fr++;
      if(p.cf===30){se('chg');pop(p,'最大タメ完了！')}
      resolveInput(p,i);
      if(p.s!=='ch')break;
      const held=C0.chKey==='NP'?i.h.P:i.h.S;
      if(!held)go(p,p.cf>=30?M[C0.chTo]:M[C0.chKey]);
      break;
    }
    case'js':if(--p.t<=0){p.s='air';p.vy=-9.6;p.vx=p.jx*2.1*p.f}break;
    case'air':
      resolveInput(p,i);
      if(p.s!=='air')break;
      p.x+=p.vx;p.vy+=.36;p.y+=p.vy;
      if(p.y>=0){p.y=0;p.vy=0;p.vx=0;p.airUsed=0;p.s='i'}
      break;
    case'bstep':
      p.fr++;
      if(p.fr>4)p.x-=p.f*3.6;
      else p.x-=p.f*4.5;
      if(--p.t<=0)p.s='i';
      break;
    case'thAtk':{
      p.fr++;
      const def=p.thTarget,dir=p.thDir,m=p.thM;
      const u=Math.min(1,p.fr/Math.max(1,p.thDur));
      if(def&&def.s==='thDef'){
        if(p.thType==='suplex'){
          def.x=p.x+dir*(26-66*u);
          def.y=-Math.sin(u*Math.PI)*78;
        }else if(p.thType==='drain'){
          def.x=p.x+dir*36;
          def.y=-Math.sin(Math.min(1,u*1.15)*Math.PI)*34;
          if(p.fr%5===0)addSpark(def.x,G+def.y-42,'#c07aff');
        }else{
          def.x=p.x+dir*(24*Math.cos(u*Math.PI)-16);
          def.y=-Math.sin(u*Math.PI)*68;
        }
      }
      if(p.fr>=p.thDur){
        if(def){
          def.y=0;def.vy=0;def.vx=0;
          def.s='dn';def.t=m.kd||60;
          const dmg=m.d;
          def.hp-=dmg;
          def.g=Math.min(4,def.g+dmg/2500);
          if(m.steal){
            const st=Math.min(def.g,m.steal);
            def.g-=st;
            p.g=Math.min(4,p.g+st);
            pop(p,'ゲージ強奪！');
          }
          const landDir=p.thType==='suplex'?-dir:dir;
          def.x=p.x+landDir*46;
          addSpark(def.x,G-12,p.thType==='drain'?'#c07aff':'#ffe250');
          se('heavy');SHK=9;HS=8;
        }
        p.thTarget=null;
        p.s='i';
      }
      break;
    }
    case'thDef':{
      p.fr++;
      if(p.fr>=p.thDur+2){p.y=0;p.s='dn';p.t=45}
      break;
    }
    case'atk':{
      const m=p.m;p.fr++;
      if(m.air){
        p.x+=p.vx;p.vy+=.36;p.y+=p.vy;
        if(p.y>=0){p.y=0;p.vy=0;p.vx=0;p.airUsed=0;p.s='i';break}
      }
      if(m.mv)p.x+=m.mv*p.f;
      if(m.hop){p.vy+=.34;p.y=Math.min(0,p.y+p.vy)}
      if(m.up){
        if(p.fr===m.s)p.vy=-16.2;
        if(p.fr>=m.s&&(p.y<0||p.vy<0)){
          if(p.vy<0)p.x+=p.f*2.2;
          p.y+=p.vy;
          p.vy+=(p.vy<0?1.15:1.45);
          if(p.y>=0){p.y=0;p.vy=0}
        }
      }
      if(m.stockAdd&&p.fr===m.s&&!p.hit){p.stock=Math.min(4,p.stock+1);pop(p,'ストック '+p.stock+'/4');se('chg');p.hit=1}
      if(m.stockMax&&p.fr===m.s&&!p.hit){p.stock=4;pop(p,'ストック MAX!');se('chg');p.hit=1}
      if(m.chaos&&p.fr===m.s&&!p.hit){p.chaosQ=5;p.chaosT=1;p.chaosIdx=0;p.hit=1}
      if(m.fb&&p.fr===m.s&&!p.hit){
        spawnFb(p,m.fb);
        if(FBS[m.fb]&&FBS[m.fb].twice){p.twT=6;p.twK=m.fb}
        p.hit=1;
      }
      if(m.d!==undefined&&p.fr>=m.s&&p.fr<m.s+m.a&&!p.hit)tryHit(p,o,m);
      resolveInput(p,i);
      if(p.s==='atk'&&p.fr>=m.t){
        if(m.air&&p.y<0){p.s='air'}
        else{p.y=0;p.vy=0;p.vx=0;p.airUsed=0;p.s='i'}
      }
      break;
    }
    case'hs':if(--p.t<=0){p.s='i';p.cmb=0}break;
    case'bs':resolveInput(p,i);if(p.s==='bs'&&--p.t<=0)p.s='i';break;
    case'gb':if(--p.t<=0){p.s='i';pop(p,'ブレイク復帰')}break;
    case'dn':resolveInput(p,i);if(p.s==='dn'&&--p.t<=0){p.s='i';p.cmb=0}break;
  }
}

function isInv(o,isProj){
  if(o.s==='dn'||o.s==='gb'||o.thWin>0||o.s==='thAtk'||o.s==='thDef')return 1;
  if(o.s==='bstep'&&o.fr<=4)return 1;
  if(o.s==='atk'&&o.m.inv&&o.fr<=o.m.inv)return 1;
  if(isProj&&o.s==='atk'&&o.m.projInv&&o.fr<=o.m.projInv)return 1;
  if(!isProj&&o.s==='atk'&&o.m.aaInv&&o.fr<=o.m.aaInv&&(o.y<0||o.s==='air'))return 1;
  return 0;
}
function tryHit(p,o,m){
  if(isInv(o,0))return;
  if(o.s==='atk'&&o.m.aaInv&&o.fr<=o.m.aaInv&&(p.y<0||p.s==='air'))return;

  const hBoxes=getHitboxes(p,m);
  const dBoxes=getHurtboxes(o);

  if(m.th){
    if(o.y<0||o.s==='js'||o.s==='air'||o.s==='bs'||o.s==='dn')return;
    const hitThrow=hBoxes.some(hb=>dBoxes.some(db=>rectsOverlap(hb,db)));
    if(!hitThrow)return;
    p.hit=1;
    if(m.cmd){
      executeThrowAnim(p,o,m,p.f);
    }else{
      o.thWin=10;o.thBy=p;o.thM=m;o.thDir=p.f;
      o.x=p.x+p.f*32;
      se('grab');
    }
    return;
  }

  let overlapped=null;
  for(const hb of hBoxes){
    for(const db of dBoxes){
      if(rectsOverlap(hb,db)){overlapped={hb,db};break}
    }
    if(overlapped)break;
  }
  if(!overlapped)return;

  if(m.rev){
    p.hit=1;
    o.s='bs';o.t=18;o.x+=p.f*95;p.x-=p.f*35;
    se('tech');
    return;
  }

  if(o.y<0&&m.h==='l')return;
  p.hit=1;
  addSpark((overlapped.hb.x1+overlapped.hb.x2)*.5,(overlapped.hb.y1+overlapped.hb.y2)*.5,'#ffe250');
  hit(p,o,m,m.t-p.fr);
}

function hit(p,o,m,rem,fbSpec,hitDir){
  const dir=hitDir||p.f;
  const holdGuard=dir>0?o.inR:o.inL;
  const canGuard=holdGuard&&(o.s==='i'||o.s==='bs')&&o.y>=0;
  const heightOk=m.h==='h'||(m.h==='m'&&!o.cr)||(m.h==='l'&&o.cr);
  if(canGuard&&heightOk){
    if(m.gb){
      o.s='gb';o.t=m.gb;o.x+=dir*14;
      pop(o,'GUARD BREAK!');se('gb');HS=12;SHK=10;
      return;
    }
    if(fbSpec&&fbSpec.gDrain){
      o.g=Math.max(0,o.g-fbSpec.gDrain);
      pop(o,'ゲージ減少！');
    }
    const chip=(fbSpec&&fbSpec.chip)||m.chip||0;
    if(chip>0&&o.hp>chip)o.hp-=chip;
    if(o.s!=='gb'){o.s='bs';o.t=Math.max(2,rem+m.g)}
    o.x+=dir*5;
    if(p.s==='atk'&&!m.noPush&&!m.air)p.x-=p.f*3;
    se('blk');
    return;
  }

  const wasAir=o.y<0;
  if(o.s!=='hs'){o.pun=o.s==='atk'&&o.fr>=o.m.s+(o.m.a||0);o.cd=0}
  const sid=m.sid||p.mid;o.cmb=o.s==='hs'?o.cmb+(o.lsid===sid?0:1):1;o.lsid=sid;
  const n=o.cmb-1;
  let scale=[1,.8,.6,.4,.2,0][Math.min(n,5)];
  if((m.k==='SUP'||(fbSpec&&fbSpec.beam))&&scale<.5&&n<5)scale=.5;
  const dm=Math.round(m.d*scale*(o.pun?1.2:1));
  o.cd+=dm;o.dn=o.cmb;o.cs=90;
  if(o.pun&&n===0)pnT=70;

  o.hp-=dm;
  o.g=Math.min(4,o.g+dm/2500);
  o.y=0;o.vy=0;o.vx=0;o.airUsed=0;
  se(dm>=1000||m.kd?'heavy':'hit');HS=Math.max(HS,dm>=1000||m.kd?7:4);if(dm>=1000||m.kd)SHK=7;

  if(m.kd||n>=5||wasAir){
    o.s='dn';o.t=m.kd||45;
    o.x+=dir*(m.pushFar?75:40);
  }else{
    o.s='hs';o.t=Math.max(2,rem+m.v+(o.pun&&n===0?2:0));
    o.x+=dir*(m.pushFar?34:12);
  }
}

function cpu(c,p,i){
  i.l=i.r=i.u=i.d=0;i.pr={};i.h={};
  if(DM===0)return;
  if(DM===1){
    const bk=c.f>0?'l':'r';
    i[bk]=1;
    const isOverheadAtk=p.s==='atk'&&p.m&&p.m.h==='m';
    const isAirApproach=p.y<0||p.s==='air'||p.s==='js';
    const isOverheadFb=fbs.some(b=>b.o===p&&!b.dead&&FBS[b.kind]&&FBS[b.kind].h==='m'&&Math.abs(b.x-c.x)<150);
    i.d=(isOverheadAtk||isAirApproach||isOverheadFb)?0:1;
    return;
  }
  const d=Math.abs(p.x-c.x),fw=c.f>0?'r':'l',bk=c.f>0?'l':'r';
  if(--ai.t<=0){
    ai.t=(DM===2?42:14)+(Math.random()*18|0);ai.f=1;
    let pool=[];
    if(c.cid===0)pool=d>250?['w','NS','NS','b','x']:d>130?['w','NK','FK','NS','FS','b']:['DP','NP','NK','BS','T','c','b','DK','FP'];
    else if(c.cid===1)pool=d>220?['w','w','BS','NS','b']:d>110?['w','FK','NS','FS','b']:['DP','NP','DS','T','FP','DK','c','b'];
    else pool=d>220?['NS','FS','BS','w','b']:d>120?['FS','NK','FK','BS','b']:['DP','DS','T','FP','DK','BP','c','b'];
    if(c.g>=1&&Math.random()<.2)pool.push('XF','XB');
    if(c.g>=.25&&d<110&&Math.random()<.15)pool.push('GB');
    if(c.g>=4&&Math.random()<.25)pool.push('SUP');
    ai.a=pool[Math.random()*pool.length|0];
    if(DM===3&&p.s==='atk'&&d<150&&Math.random()<.65)ai.a=Math.random()<.5?'b':'c';
    if(DM===3&&(c.s==='bs'||c.s==='dn')&&c.g>=1&&Math.random()<.25)ai.a='REV';
  }
  const a=ai.a;
  if(a==='w')i[fw]=1;
  else if(a==='b')i[bk]=1;
  else if(a==='c'){i[bk]=1;i.d=1}
  else if(a==='REV'){i[bk]=1;i.pr.SYS=1}
  else if(a==='GB'){i[fw]=1;i.pr.SYS=1}
  else if(a==='SUP'){i.pr.SUP=1}
  else if(a!=='x'&&ai.f){
    ai.f=0;
    if(a==='T')i.pr.T=1;
    else if(a[0]==='X'){
      const r=a[1];if(r==='F')i[fw]=1;if(r==='B')i[bk]=1;if(r==='D')i.d=1;i.pr.X=1;
    }else{
      const r=a[0];if(r==='F')i[fw]=1;if(r==='B')i[bk]=1;if(r==='D')i.d=1;i.pr[a[1]]=1;
    }
  }
  if(c.cid===1&&c.s==='atk'&&c.m.k==='BS'&&c.fr===12){
    i.pr[Math.random()<.5?'P':'K']=1;
  }
}

function processInputBuffer(inp){
  if(inp.buf.length){
    const keys=new Set(inp.buf.map(v=>v.b));
    if(
      (keys.has('S')&&keys.has('P')&&keys.has('K'))||
      (keys.has('X')&&keys.has('S'))||
      (keys.has('X')&&keys.has('SYS'))||
      (inp.h.X&&(inp.pr.S||inp.pr.SYS))||
      ((inp.h.S||inp.h.SYS)&&inp.pr.X)||
      (inp.h.P&&inp.h.K&&inp.h.S)
    )inp.pr.SUP=1;
    else if((keys.has('P')&&keys.has('K'))||(inp.h.P&&inp.pr.K)||(inp.h.K&&inp.pr.P))inp.pr.T=1;
    else if((keys.has('S')&&(keys.has('P')||keys.has('K')))||((inp.h.P||inp.h.K)&&inp.pr.S)||(inp.h.S&&(inp.pr.P||inp.pr.K)))inp.pr.X=1;
    inp.buf=inp.buf.filter(v=>--v.t>0);
  }
}

function copyLocalTo1P(){
  I.l=LOC.l;I.r=LOC.r;I.u=LOC.u;I.d=LOC.d;
  I.pr=Object.assign({},LOC.pr);
  I.h=Object.assign({},LOC.h);
  while(LOC.buf.length)I.buf.push(LOC.buf.shift());
  LOC.pr={};
}

function update(){
  if(NET.active){
    pumpLocalNetInputs();
    if(!NET.in1.has(NET.simFr)||!NET.in2.has(NET.simFr)){
      NET.waitFrames++;
      return;
    }
    NET.waitFrames=0;
    const b1=NET.in1.get(NET.simFr);
    const b2=NET.in2.get(NET.simFr);
    NET.in1.delete(NET.simFr);
    NET.in2.delete(NET.simFr);
    applyBitsToInp(b1,NET.prev1,I);
    applyBitsToInp(b2,NET.prev2,CI);
    NET.prev1=b1;
    NET.prev2=b2;
    NET.simFr++;
  }else{
    copyLocalTo1P();
  }

  FR++;
  if(HS>0){HS--;return}
  if(cutT>0){cutT--;return}
  if(ph===2)return;
  if(ph===1){if(--pt<=0)round();return}

  processInputBuffer(I);
  if(NET.active){
    processInputBuffer(CI);
  }else{
    cpu(E,P,CI);
    if(RV&&((E.s==='dn'&&E.t<=3)||E.s==='bs')){CI[E.f>0?'l':'r']=1;CI.pr.SYS=1}
    if(TK&&E.thWin>0)CI.pr.T=1;
  }

  step(P,E,I);
  step(E,P,CI);
  I.pr={};
  CI.pr={};

  for(const b of fbs){
    b.px=b.x;b.py=b.y;
    const d=FBS[b.kind];
    if(b.wait>0){
      b.wait--;
      if(b.wait===0&&b.target){
        const tx=b.target.x,ty=b.target.y-42;
        const ang=Math.atan2(ty-b.y,tx-b.x);
        b.vx=Math.cos(ang)*b.spd;
        b.vy=Math.sin(ang)*b.spd;
        b.dir=b.vx>=0?1:-1;
      }
      continue;
    }
    b.life++;
    if(d.beam){if(b.life>=20)b.dead=1;continue}
    if(d.boom){
      if(!b.ret){
        b.x+=b.vx;
        if(b.life>=36||b.x<-35||b.x>W+35){
          b.ret=1;
          b.hitLock=0;
        }
      }else{
        const toOwner=b.o.x>=b.x?1:-1;
        b.dir=toOwner;
        b.vx=toOwner*6.8;
        b.x+=b.vx;
        if(Math.abs(b.x-b.o.x)<26)b.dead=1;
      }
    }else{
      b.x+=b.vx;
      b.y+=b.vy;
    }
  }

  for(let idx1=0;idx1<fbs.length;idx1++){
    const b=fbs[idx1];
    if(b.dead||b.wait>0)continue;
    const d1=FBS[b.kind];
    for(let idx2=idx1+1;idx2<fbs.length;idx2++){
      const b2=fbs[idx2];
      if(b2.dead||b2.wait>0||b.o===b2.o)continue;
      const d2=FBS[b2.kind];
      const rSum=d1.rad+d2.rad+8;
      const mx1=(b.x+b.px)*.5,my1=(b.y+b.py)*.5;
      const mx2=(b2.x+b2.px)*.5,my2=(b2.y+b2.py)*.5;
      const hitNow=Math.hypot(b.x-b2.x,b.y-b2.y)<rSum;
      const hitMid=Math.hypot(mx1-mx2,my1-my2)<rSum;
      if(hitNow||hitMid){
        if(!d1.beam){b.dead=1;if(d1.one)b.o.fb=0}
        if(!d2.beam){b2.dead=1;if(d2.one)b2.o.fb=0}
        addSpark((b.x+b2.x)*.5,G+(b.y+b2.y)*.5,'#fff');
        se('blk');
      }
    }
  }

  fbs=fbs.filter(b=>{
    if(b.dead)return 0;
    if(b.wait>0)return 1;
    const d=FBS[b.kind],o=b.o===P?E:P;

    if(!d.beam&&b.y>=0){if(d.one)b.o.fb=0;return 0}

    const dBoxes=getHurtboxes(o);
    let fbHit=0;
    if(d.beam){
      const beamBox={
        x1:b.dir>0?b.o.x+20:0,
        y1:G-68,
        x2:b.dir>0?W:b.o.x-20,
        y2:G-32
      };
      fbHit=dBoxes.some(db=>rectsOverlap(beamBox,db));
    }else{
      fbHit=dBoxes.some(db=>circleRectOverlap(b.x,G+b.y,d.rad,db));
    }

    if(!b.hitLock&&!isInv(o,1)&&fbHit){
      b.o.hit=1;
      addSpark(b.x,G+b.y,d.col);
      hit(b.o,o,{d:d.d,h:d.h,g:d.g,v:d.v,kd:d.kd,k:d.beam?'SUP':'FB',sid:b.sid||(b.sid=++SID)},0,d,b.dir);
      b.hits++;
      if(d.beam||d.boom){
        b.hitLock=14;
        if(!d.beam&&b.hits>=2)return 0;
      }else{
        if(d.one)b.o.fb=0;
        return 0;
      }
    }
    if(b.hitLock>0)b.hitLock--;

    if(!d.beam&&!d.boom&&(b.x<-40||b.x>W+40)){if(d.one)b.o.fb=0;return 0}
    return 1;
  });

  sparks=sparks.filter(s=>--s.t>0);

  const dx=E.x-P.x;
  if(Math.abs(dx)<CW&&P.y===0&&E.y===0&&P.s!=='thAtk'&&P.s!=='thDef'&&E.s!=='thAtk'&&E.s!=='thDef'&&P.thWin===0&&E.thWin===0){
    const k=(CW-Math.abs(dx))/2*(dx<0?-1:1);
    E.x+=k;P.x-=k;
  }
  for(const q of[P,E])q.x=Math.max(20,Math.min(W-20,q.x));

  recordFM();

  if(P.cs>0)P.cs--;
  if(E.cs>0)E.cs--;
  if(pnT>0)pnT--;

  if(--T<=0||P.hp<=0||E.hp<=0){
    const w=P.hp>E.hp?0:E.hp>P.hp?1:-1;
    if(w>=0)rw[w]++;
    msg=w<0?'引き分け':w===0?'1P 勝利！':'2P 勝利！';
    ph=1;pt=120;
    if(rw[0]>=2||rw[1]>=2){ph=2;msg+='（画面タップで再戦）'}
  }
}

function lb(x,y,a,l,b,m){
  const jx=x+Math.sin(R(a))*l,jy=y+Math.cos(R(a))*l;
  X.moveTo(x,y);X.lineTo(jx,jy);X.lineTo(jx+Math.sin(R(b))*m,jy+Math.cos(R(b))*m);
}

function body(p){
  const y=G+p.y,h=p.cr?56:88,s=p.s;
  const po=getPose(p);

  X.save();X.translate(p.x,y);X.scale(p.f,1);X.lineCap='round';X.lineJoin='round';
  X.fillStyle='rgba(0,0,0,.35)';X.beginPath();X.ellipse(0,-p.y,24,5,0,0,7);X.fill();
  if(po.tilt){
    X.translate(0,-42);
    X.rotate(po.tilt);
    X.translate(0,42);
  }
  X.strokeStyle=s==='hs'?'#fff':s==='gb'?'#ff7a45':p.c;
  X.fillStyle=X.strokeStyle;X.lineWidth=7;

  if(s==='dn'){
    X.beginPath();X.moveTo(-32,-9);X.lineTo(10,-9);X.lineTo(32,-4);X.stroke();
    X.beginPath();X.arc(-40,-12,9,0,7);X.fill();
  }else{
    const sx=po.ln,sy=po.sy,hy=po.hy;
    X.beginPath();X.moveTo(0,hy);X.lineTo(sx,sy);
    lb(0,hy,po.lF[0],19+po.extK*.45,po.lF[1],19+po.extK*.55);
    lb(0,hy,po.lB[0],19+po.extB*.45,po.lB[1],19+po.extB*.55);
    X.stroke();
    X.beginPath();lb(sx,sy+3,po.aB[0],15,po.aB[1],15);X.stroke();
    X.beginPath();lb(sx,sy+3,po.aF[0],15+po.extF*.45,po.aF[1],15+po.extF*.55);X.stroke();
    X.beginPath();X.arc(sx*1.2+2,sy-12,10,0,7);X.fill();
    X.fillStyle='#fff';X.fillRect(sx*1.2+6,sy-15,4,4);
    if(s==='bs'){
      X.strokeStyle=p.cr?'#5ce1e6':'#6fe3ff';X.lineWidth=3;
      X.beginPath();X.arc(18,sy+8,34,-1.1,1.1);X.stroke();
    }
    if(s==='gb'){X.strokeStyle='#ff5d5d';X.lineWidth=3;X.beginPath();X.moveTo(14,sy-18);X.lineTo(24,sy+6);X.lineTo(12,sy+26);X.stroke()}
  }
  X.restore();

  if(HB_VIS&&s!=='dn'){
    X.save();
    X.fillStyle='#fff';
    X.beginPath();X.arc(po.handF.x,po.handF.y,2.8,0,7);X.fill();
    X.beginPath();X.arc(po.footF.x,po.footF.y,2.8,0,7);X.fill();
    X.restore();
  }

  if(p.thWin>0||s==='thAtk'){
    X.save();
    X.strokeStyle='#50ff8c';X.lineWidth=2;
    X.beginPath();X.arc(p.x+p.f*18,G+p.y-46,16+Math.sin(FR*.6)*4,0,7);X.stroke();
    X.restore();
  }

  if(s==='atk'&&po.isWindup&&p.m){
    const m=p.m,w=po.wup;
    const isKick=m.k.includes('K')||m.k==='BS'||m.k==='XB';
    const focus=isKick?po.footF:po.handF;
    X.save();
    if(m.gb){
      X.strokeStyle='#ff9f43';X.lineWidth=2.5;
      X.beginPath();X.arc(focus.x,focus.y,6+10*(1-w),0,7);X.stroke();
      X.fillStyle='rgba(255,159,67,.45)';
      X.beginPath();X.arc(focus.x,focus.y,5+3*w,0,7);X.fill();
    }else if(m.up){
      X.strokeStyle='#6fe3ff';X.lineWidth=2;
      X.beginPath();X.arc(p.x,G-6,12+10*(1-w),Math.PI,0);X.stroke();
    }else if(m.th){
      X.strokeStyle='#50ff8c';X.lineWidth=2;
      X.beginPath();X.arc(focus.x,focus.y,5+8*(1-w),0,7);X.stroke();
    }else if(m.fb||m.stockAdd||m.stockMax||m.chaos||m.k==='SUP'){
      const col=m.k==='SUP'?'#ff77e9':p.c;
      X.fillStyle=col;X.globalAlpha=.45+.35*w;
      X.beginPath();X.arc(focus.x,focus.y,4+9*w,0,7);X.fill();
      X.strokeStyle='#fff';X.lineWidth=1.5;
      X.beginPath();X.arc(focus.x,focus.y,4+13*(1-w),0,7);X.stroke();
    }else if(m.h==='m'){
      X.fillStyle='#ffb347';X.globalAlpha=.85;
      X.beginPath();X.arc(focus.x,focus.y,5+3*w,0,7);X.fill();
      X.strokeStyle='#fff';X.lineWidth=1.5;
      X.beginPath();X.arc(focus.x,focus.y,8+6*(1-w),0,7);X.stroke();

      X.fillStyle='#5ce1e6';X.globalAlpha=.85;
      X.beginPath();X.arc(focus.x,focus.y,5+3*w,0,7);X.fill();
      X.strokeStyle='#fff';X.lineWidth=1.5;
      X.beginPath();X.arc(focus.x,focus.y,8+6*(1-w),0,7);X.stroke();
    }else{
      X.strokeStyle='rgba(255,255,255,.75)';X.lineWidth=2;

if(s==='ch'){

  }

  X.fillStyle='#fff';X.font='11px system-ui';X.textAlign='center';
  X.fillText(p.n,p.x,y-h-14);
  if(p.popT>0){
    X.fillStyle='#ffe250';X.font='bold 13px system-ui';
    X.fillText(p.pop,p.x,y-h-30-(48-p.popT)*.3);
  }
}

function drawBoxes(p){
  if(!HB_VIS)return;
  const fullInv=isInv(p,0)&&isInv(p,1);
  const projInvOnly=!fullInv&&isInv(p,1);
  const aaInvOnly=!fullInv&&p.s==='atk'&&p.m.aaInv&&p.fr<=p.m.aaInv;

  if(p.s!=='dn'&&p.s!=='thAtk'&&p.s!=='thDef'){
    const pb=getPushbox(p);
    X.save();
    X.strokeStyle='rgba(255,255,255,.32)';
    X.lineWidth=1;
    X.setLineDash([3,3]);
    X.strokeRect(pb.x1,pb.y1,pb.x2-pb.x1,pb.y2-pb.y1);
    X.restore();
  }

  const dBoxes=getHurtboxes(p);
  X.save();
  for(const b of dBoxes){
    if(fullInv){
      X.fillStyle='rgba(160,170,195,.08)';
      X.strokeStyle='rgba(180,190,210,.45)';
      X.setLineDash([3,3]);
    }else if(projInvOnly){
      X.fillStyle='rgba(192,122,255,.16)';
      X.strokeStyle='#d49eff';
      X.setLineDash([4,2]);
    }else if(aaInvOnly){
      X.fillStyle='rgba(92,225,230,.16)';
      X.strokeStyle='#5ce1e6';
      X.setLineDash([4,2]);
    }else{
      X.setLineDash([]);
      if(b.part==='head'){
        X.fillStyle='rgba(80,210,255,.24)';

      }else if(b.part==='torso'||b.part==='body'){
        X.fillStyle='rgba(60,145,255,.22)';
        X.strokeStyle='#4aa3ff';
      }else{
        X.fillStyle='rgba(77,224,160,.18)';
        X.strokeStyle='#4de0a0';
      }
    }
    X.lineWidth=1.3;
    X.fillRect(b.x1,b.y1,b.x2-b.x1,b.y2-b.y1);
    X.strokeRect(b.x1,b.y1,b.x2-b.x1,b.y2-b.y1);
  }
  X.restore();

  const m=p.m;
  if(p.s==='atk'&&m&&m.d!==undefined&&p.fr>=m.s&&p.fr<m.s+m.a){
    const hBoxes=getHitboxes(p,m);
    X.save();
    for(const b of hBoxes){
      const isTh=b.kind==='throw';
      X.fillStyle=isTh?'rgba(80,255,140,.34)':m.gb?'rgba(255,140,60,.38)':'rgba(255,65,90,.36)';
      X.strokeStyle=isTh?'#50ff8c':m.gb?'#ff9f43':'#ff415a';
      X.lineWidth=1.8;

      X.strokeRect(b.x1,b.y1,b.x2-b.x1,b.y2-b.y1);
    }
    X.restore();
  }
}

function draw(){
  X.fillStyle='#0d0e14';X.fillRect(0,0,W,360);
  X.fillStyle='#232738';X.fillRect(0,G,W,360-G);

  X.strokeStyle='rgba(255,255,255,.045)';X.lineWidth=1;
  for(let gy=G-20;gy>=120;gy-=20){
    X.beginPath();X.moveTo(0,gy);X.lineTo(W,gy);X.stroke();
  }

  for(const[q,l]of[[P,1],[E,0]]){
    const x=l?12:W/2+28,w=W/2-40,f=Math.max(0,q.hp/1e4)*w;
    X.fillStyle='#2a2d3a';X.fillRect(x,12,w,14);
    X.fillStyle=q.hp<3000?'#ff5d5d':'#ffd34d';
    X.fillRect(l?x:x+w-f,12,f,14);

    X.fillStyle='#2a2d3a';X.fillRect(x,30,w,7);
    X.fillStyle=q.g>=4?'#ff77e9':'#4de0a0';
    const gw=q.g/4*w;
    X.fillRect(l?x:x+w-gw,30,gw,7);
    X.fillStyle='#0d0e14';
    for(let k=1;k<4;k++)X.fillRect(x+w*k/4-1,30,2,7);

    X.fillStyle='#fff';
    for(let k=0;k<2;k++){
      X.globalAlpha=k<rw[l?0:1]?1:.25;
      X.beginPath();X.arc(l?x+8+k*14:x+w-8-k*14,47,5,0,7);X.fill();
    }
    X.globalAlpha=1;
    X.font='bold 11px system-ui';X.textAlign=l?'left':'right';
    let sub=CHARS[q.cid].name;
    if(NET.active&&((l&&NET.side===1)||(!l&&NET.side===2)))sub+='(あなた)';
    if(q.cid===2)sub+=' [弾:'+q.stock+'/4]';
    if(q.g>=4)sub+=' ★超必殺OK';
    X.fillStyle=q.g>=4?'#ff9ef2':'#b8bfd8';
    X.fillText(sub,l?x+38:x+w-38,51);
  }

  X.fillStyle='#fff';X.font='bold 24px system-ui';X.textAlign='center';
  X.fillText('∞',W/2,31);

  if(pnT>0){
    X.save();X.globalAlpha=Math.min(.45,pnT/35);
    X.fillStyle='#ff4d6d';X.font='italic 900 84px system-ui';X.textAlign='center';
    X.fillText('パニッシュ',W/2,185);X.restore();
  }

  if(E.s==='thAtk'){body(P);body(E)}
  else{body(E);body(P)}
  drawBoxes(P);drawBoxes(E);

  for(const b of fbs){
    const d=FBS[b.kind];
    if(b.wait>0){
      X.save();
      X.strokeStyle=d.col;X.lineWidth=2;
      X.beginPath();X.arc(b.x,G+b.y,d.rad+b.wait*.7,0,7);X.stroke();
      X.fillStyle=d.col;X.globalAlpha=.65;
      X.beginPath();X.arc(b.x,G+b.y,d.rad*(1-b.wait/30),0,7);X.fill();
      X.restore();
      continue;
    }
    X.fillStyle=d.col;
    if(d.beam){
      const bx=b.dir>0?b.o.x+20:0,bw=b.dir>0?W-b.o.x-20:b.o.x-20;
      X.fillRect(bx,G-68,bw,36);
      X.fillStyle='#fff';
      X.fillRect(bx,G-56,bw,12);
      if(HB_VIS){
        X.strokeStyle='#ff415a';X.lineWidth=2;
        X.strokeRect(bx,G-68,bw,36);
      }
    }else if(d.boom){
      X.save();X.translate(b.x,G+b.y);X.rotate(FR*.4);
      X.fillRect(-d.rad,-4,d.rad*2,8);X.fillRect(-4,-d.rad,8,d.rad*2);
      X.restore();
      if(HB_VIS){
        X.strokeStyle='#ff415a';X.lineWidth=1.5;
        X.beginPath();X.arc(b.x,G+b.y,d.rad,0,7);X.stroke();
      }
    }else{
      X.beginPath();X.arc(b.x,G+b.y,d.rad,0,7);X.fill();
      if(HB_VIS){
        X.strokeStyle='#ff415a';X.lineWidth=1.5;
        X.beginPath();X.arc(b.x,G+b.y,d.rad,0,7);X.stroke();
      }
    }
  }

  for(const s of sparks){
    X.save();
    X.globalAlpha=s.t/12;
    X.strokeStyle=s.col;X.lineWidth=3;
    X.beginPath();X.arc(s.x,s.y,(13-s.t)*2.6,0,7);X.stroke();
    X.restore();
  }

  if(!FM_VIS&&HB_VIS){
    X.font='10px system-ui';X.textAlign='left';
    const lx=12,ly=320;
    X.fillStyle='#4aa3ff';X.fillRect(lx,ly-8,8,8);X.fillStyle='#b8bfd8';X.fillText('頭/胴食らい',lx+11,ly);
    X.fillStyle='#4de0a0';X.fillRect(lx+72,ly-8,8,8);X.fillStyle='#b8bfd8';X.fillText('手足食らい',lx+83,ly);
    X.fillStyle='#ff415a';X.fillRect(lx+142,ly-8,8,8);X.fillStyle='#b8bfd8';X.fillText('攻撃判定',lx+153,ly);
    X.fillStyle='#50ff8c';X.fillRect(lx+202,ly-8,8,8);X.fillStyle='#b8bfd8';X.fillText('投げ判定',lx+213,ly);
    X.fillStyle='#d49eff';X.fillRect(lx+262,ly-8,8,8);X.fillStyle='#b8bfd8';X.fillText('弾/対空無敵',lx+273,ly);
  }

  drawFrameMeter();

  for(const[q,l]of[[E,1],[P,0]])if(q.cs>0){
    const x=l?12:W-12;X.textAlign=l?'left':'right';
    X.fillStyle='#ffd34d';X.font='bold 18px system-ui';X.fillText(q.dn+'技コンボ',x,76);
    X.font='bold 14px system-ui';X.fillText(q.cd+' ダメージ'+(q.pun?'（パニッシュ）':''),x,96);
  }

  if(cutT>0){
    X.fillStyle='rgba(0,0,0,.78)';X.fillRect(0,75,W,170);
    X.fillStyle=cutCol;X.fillRect(0,82,W,4);X.fillRect(0,234,W,4);
    X.fillStyle='#fff';X.font='italic 900 32px system-ui';X.textAlign='center';
    X.fillText(cutTxt,W/2,172);
  }

  if(msg){
    X.fillStyle='#fff';X.font='bold 28px system-ui';X.textAlign='center';
    X.fillText(msg,W/2,165);
  }

  const myFighter=(NET.active&&NET.side===2)?E:P;
  if(myFighter.g>=4&&ph===0&&cutT===0){
    const bx=(NET.active&&NET.side===2)?W-197:12;
    X.fillStyle='rgba(255,119,233,.34)';X.fillRect(bx,58,185,28);
    X.strokeStyle='#ff77e9';X.lineWidth=2;X.strokeRect(bx,58,185,28);
    X.fillStyle='#fff';X.font='bold 12px system-ui';X.textAlign='center';
    X.fillText('★超必殺 (EX+SP / EX+S / タップ)',bx+92,76);
  }

  if(NET.active&&NET.waitFrames>12){
    X.fillStyle='rgba(0,0,0,.65)';X.fillRect(W/2-110,135,220,34);
    X.fillStyle='#ffd34d';X.font='bold 13px system-ui';X.textAlign='center';
    X.fillText('通信同期待機中...',W/2,157);
  }

  X.fillStyle='#8d94ad';X.font='10px system-ui';X.textAlign='center';
  X.fillText('→+S:GB(0.25) / ←+S:切り返し(1本) / ←←:バクステ / 空中P・K:中段 / 背後弾:→ガード',W/2,356);
}

    const r=e.getBoundingClientRect(),dx=v.clientX-(r.left+r.width/2),dy=v.clientY-(r.top+r.height/2);
    const L=Math.hypot(dx,dy),m=r.width/2-30,s=L>m?m/L:1,z=r.width*.17;

    const vv=Math.abs(dy)>z&&Math.abs(dy)>Math.abs(dx)*.55;LOC.l=dx<-z?1:0;LOC.r=dx>z?1:0;LOC.u=vv&&dy<0?1:0;LOC.d=vv&&dy>0?1:0;
  }
  function off(){id=null;k.style.transform='';LOC.l=LOC.r=LOC.u=LOC.d=0}
  e.addEventListener('pointerdown',v=>{v.preventDefault();id=v.pointerId;e.setPointerCapture(id);mv(v)});
  e.addEventListener('pointermove',v=>{if(v.pointerId===id)mv(v)});
  for(const t of['pointerup','pointercancel'])e.addEventListener(t,v=>{if(v.pointerId===id)off()});
})();

function bindConnEvents(conn,isHost){
  NET.conn=conn;
  conn.on('open',()=>{
    if(!isHost){
      updateNetUI('接続成功！対戦開始を同期中...');
      sendNet({t:'hello',cid:NET.myCid,dly:NET.delay});
    }
  });
  conn.on('data',msg=>{
    if(!msg||typeof msg!=='object')return;
    if(msg.t==='hello'&&isHost){
      const dly=Math.max(2,Math.min(6,Math.max(NET.delay,msg.dly||3)));
      const cid1=NET.myCid,cid2=Number(msg.cid)||0;
      sendNet({t:'start',cid1,cid2,dly});
      startNetMatch(1,cid1,cid2,dly);
    }else if(msg.t==='start'&&!isHost){
      startNetMatch(2,msg.cid1,msg.cid2,msg.dly);
    }else if(msg.t==='in'&&NET.active&&Array.isArray(msg.list)){
      const targetMap=NET.side===1?NET.in2:NET.in1;
      for(const pair of msg.list){
        const f=pair[0],b=pair[1];
        if(f>=NET.simFr&&!targetMap.has(f))targetMap.set(f,b);
      }
    }else if(msg.t==='rematch'&&NET.active){
      NET.rematchPeer=1;
      if(isHost){
        if(NET.rematchSelf){
          const dly=NET.delay,cid1=NET.myCid,cid2=cSel[1];
          sendNet({t:'start',cid1,cid2,dly});
          startNetMatch(1,cid1,cid2,dly);
        }else{
          pop(E,'相手が再戦を希望！');
          updateNetUI('相手が再戦を希望しています（「もう1戦」で開始）');
        }
      }else{
        pop(P,'相手が再戦を希望！');
        updateNetUI('相手が再戦を希望しています（「もう1戦」で開始）');
      }
    }
  });
  conn.on('close',()=>stopNetMatch('相手との通信が切断されました'));
  conn.on('error',()=>stopNetMatch('通信エラーが発生しました'));
}

function createHostRoom(retryCount){
  if(typeof Peer==='undefined'){
    updateNetUI('通信ライブラリの読み込みに失敗しました。ネット接続を確認してください。');
    return;
  }
  stopNetMatch();
  const code=String(1000+Math.floor(Math.random()*9000));
  const peerId='fg2d-jp-v1-'+code;
  NET.room=code;
  updateNetUI('部屋を作成中...');
  const peer=new Peer(peerId);
  NET.peer=peer;
  peer.on('open',()=>{
    $('oRoomCode').textContent=code;
    $('oRoomCode').style.display='inline-block';
    $('oCopyBtn').style.display='inline-block';
    $('oDiscBtn').style.display='inline-block';
    updateNetUI('待機中... 合言葉【 '+code+' 】を相手に入力してもらってください');
  });
  peer.on('connection',conn=>{
    if(NET.conn){try{conn.close()}catch(e){}return}
    bindConnEvents(conn,true);
  });
  peer.on('error',err=>{
    if(err&&err.type==='unavailable-id'&&(retryCount||0)<5){
      createHostRoom((retryCount||0)+1);
    }else{
      stopNetMatch('部屋作成エラー: '+(err.type||'接続失敗'));
    }
  });
}

$('oHostBtn').addEventListener('pointerdown',()=>createHostRoom(0));
$('oCopyBtn').addEventListener('pointerdown',()=>{
  if(navigator.clipboard&&NET.room){
    navigator.clipboard.writeText(NET.room).then(()=>{
      $('oCopyBtn').textContent='コピー済!';
      setTimeout(()=>{$('oCopyBtn').textContent='コピー'},1500);
    }).catch(()=>{});
  }
});

$('oJoinBtn').addEventListener('pointerdown',()=>{
  if(typeof Peer==='undefined'){
    updateNetUI('通信ライブラリの読み込みに失敗しました。');
    return;
  }
  const code=($('oJoinInp').value||'').replace(/\D/g,'').slice(0,4);
  if(code.length!==4){
    updateNetUI('4桁の数字を入力してください');
    return;
  }
  stopNetMatch();
  updateNetUI('合言葉【 '+code+' 】の部屋に接続中...');
  $('oDiscBtn').style.display='inline-block';
  const peer=new Peer();
  NET.peer=peer;
  peer.on('open',()=>{
    const conn=peer.connect('fg2d-jp-v1-'+code,{reliable:true});
    bindConnEvents(conn,false);
  });
  peer.on('error',err=>{
    stopNetMatch('接続失敗（合言葉が違うか部屋が閉じています）');
  });
});

function requestRematch(){
  if(!NET.active)return;
  NET.rematchSelf=1;
  sendNet({t:'rematch'});
  if(NET.side===1&&NET.rematchPeer){
    const dly=NET.delay,cid1=NET.myCid,cid2=cSel[1];
    sendNet({t:'start',cid1,cid2,dly});
    startNetMatch(1,cid1,cid2,dly);
  }else{
    pop(NET.side===1?P:E,'再戦リクエスト送信');
    updateNetUI('相手の再戦応答を待っています...');
  }
}

$('oRematchBtn').addEventListener('pointerdown',()=>requestRematch());
$('oDiscBtn').addEventListener('pointerdown',()=>stopNetMatch('切断しました（オフラインモード）'));

const KM={ArrowLeft:'l',a:'l',ArrowRight:'r',d:'r',ArrowUp:'u',w:'u',ArrowDown:'d',s:'d'};
const KB={j:'P',z:'P',k:'K',x:'K',l:'S',c:'S',u:'T',v:'T',i:'X',b:'X',o:'SYS',n:'SYS',Enter:'SUP',' ':'SUP'};
addEventListener('keydown',e=>{
  if(document.activeElement&&document.activeElement.tagName==='INPUT')return;
  if(KM[e.key])LOC[KM[e.key]]=1;
  else if(KB[e.key]&&!e.repeat){
    const k=KB[e.key];
    LOC.h[k]=1;
    if(k==='SUP')LOC.pr.SUP=1;
    else pushBtn(k);
  }
});
addEventListener('keyup',e=>{
  if(KM[e.key])LOC[KM[e.key]]=0;
  else if(KB[e.key])LOC.h[KB[e.key]]=0;
});

C.addEventListener('pointerdown',e=>{
  if(ph===2){
    if(NET.active){requestRematch();return}
    rw=[0,0];P.g=E.g=0;round();return;
  }
  const r=C.getBoundingClientRect(),cx=(e.clientX-r.left)/r.width*W,cy=(e.clientY-r.top)/r.height*360;
  if(NET.active&&NET.side===2){
    if(E.g>=4&&cx>=W-210&&cy<=95)LOC.pr.SUP=1;
  }else{
    if(P.g>=4&&cx<=210&&cy<=95)LOC.pr.SUP=1;
  }
});
</script></body></html>
